name: DevSculptor CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend CI (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devsculptor-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: devsculptor-backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Backend (ESLint)
        run: npm run lint

      - name: Run Backend Tests (Vitest)
        run: npm test

      - name: Compile & Build Backend (TypeScript + Alias)
        run: npm run build

  frontend:
    name: Frontend CI (Lint, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devsculptor-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: devsculptor-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Frontend (oxlint)
        run: npm run lint

      - name: Build Frontend (Vite)
        run: npm run build
